[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redisjobs"
version = "0.1.0"
description = "Asynchronous, Redis-backed job queue with retries, priorities, scheduling and a dead-letter queue."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ahmed Ayyad" }]
keywords = ["redis", "queue", "jobs", "tasks", "asyncio", "worker", "background"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = ["redis>=5.0.0"]

[project.optional-dependencies]
dev = [
    "fakeredis[lua]>=2.20.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/ahmedayyad-dev/redisjobs"
Repository = "https://github.com/ahmedayyad-dev/redisjobs"

[project.scripts]
redisjobs = "redisjobs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/redisjobs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
    "SIM108",   # ternary is not always clearer
    "ASYNC109", # `timeout` is a domain term here, not an asyncio.timeout candidate
    "UP047",    # PEP 695 generics optional; TypeVar overloads are clearer here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["fakeredis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disable_error_code = ["arg-type"]
